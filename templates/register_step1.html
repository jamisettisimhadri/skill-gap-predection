<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: Basic Info | Skill Gateway AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page register-page-bg">
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    <div class="container" style="max-width: 550px;">
        <div class="glass-card">
            <div class="hero-section">
                <div class="ai-badge">STEP 01/03</div>
                <h2>Basic Information</h2>
                <p style="color: var(--text-dim); margin-bottom: 15px;">Start your journey with your basic details</p>
            </div>

            <div class="step-indicator">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            {% if error %}
            <div
                style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em; border: 1px solid rgba(239, 68, 68, 0.2);">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('register_step1') }}" method="POST">
                <div class="form-grid">
                    <div class="input-wrapper full">
                        <label>Full Name</label>
                        <input type="text" name="fullname" placeholder="E.g. Alexander Pierce"
                            value="{{ session.get('reg_data', {}).get('fullname', '') }}" required>
                    </div>
                    <div class="input-wrapper">
                        <label>Student ID</label>
                        <input type="text" name="student_id" placeholder="UID-12345"
                            value="{{ session.get('reg_data', {}).get('student_id', '') }}" required>
                    </div>
                    <div class="input-wrapper">
                        <label>Email ID</label>
                        <input type="email" name="email" placeholder="name@email.com"
                            value="{{ session.get('reg_data', {}).get('email', '') }}" required>
                    </div>
                    <div class="input-wrapper">
                        <label>Mobile Number</label>
                        <input type="text" name="mobile" placeholder="+91 9876543210"
                            value="{{ session.get('reg_data', {}).get('mobile', '') }}">
                    </div>
                    <div class="input-wrapper">
                        <label>Date of Birth</label>
                        <input type="date" name="dob" value="{{ session.get('reg_data', {}).get('dob', '') }}">
                    </div>
                    <div class="input-wrapper">
                        <label>Age</label>
                        <input type="number" name="age" min="15" max="60"
                            value="{{ session.get('reg_data', {}).get('age', '') }}">
                    </div>
                    <div class="input-wrapper">
                        <label>Gender</label>
                        <select name="gender">
                            <option value="Male" {% if session.get('reg_data', {}).get('gender')=='Male' %}selected{%
                                endif %}>Male</option>
                            <option value="Female" {% if session.get('reg_data', {}).get('gender')=='Female'
                                %}selected{% endif %}>Female</option>
                            <option value="Other" {% if session.get('reg_data', {}).get('gender')=='Other' %}selected{%
                                endif %}>Other</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group" style="margin-top: 30px;">
                    <button type="submit" class="cta-button">Next: Academic Info</button>
                </div>
            </form>
            <p style="margin-top: 25px; text-align: center; color: var(--text-dim);">
                Already registered? <a href="/login"
                    style="color: var(--accent); text-decoration: none; font-weight: 600;">Sign In</a>
            </p>
        </div>
    </div>
</body>

</html>
